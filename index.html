<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Weaver</title>
    <link rel="stylesheet" href="styles/app.css" />
    <script src="src/vendor/clipper.js"></script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <header id="topbar">
      <div class="brand">Map Weaver</div>
      <div class="group" id="file-buttons"></div>
      <div class="group" id="history-buttons"></div>
      <div class="title" id="doc-title"></div>
    </header>
    <div id="main">
      <nav id="toolbar" aria-label="Tools"></nav>
      <div id="stage">
        <canvas id="canvas" tabindex="0"></canvas>
        <div id="loading">Loading…</div>
      </div>
      <aside id="panel"></aside>
    </div>
    <footer id="statusbar">
      <span id="status-cursor"></span>
      <span id="status-zoom"></span>
      <span id="status-rooms"></span>
      <span id="status-message"></span>
    </footer>
    <dialog id="open-dialog">
      <form method="dialog">
        <h2>Open map</h2>
        <ul id="map-list"></ul>
        <menu><button value="cancel">Cancel</button></menu>
      </form>
    </dialog>
  </body>
</html>
