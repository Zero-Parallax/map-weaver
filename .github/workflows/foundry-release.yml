# Build and publish the Foundry VTT module.
#
# Push a tag and this does the rest:
#     git tag v0.2.0 && git push origin v0.2.0
#
# tools/build-foundry.mjs stamps the version into module.json and bundles the editor; the zip
# has module.json at its root, as Foundry expects. The release gets the zip and a manifest that
# points at "latest", so Foundry offers updates.

name: Foundry module release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test

      - name: Build the module
        run: node tools/build-foundry.mjs "${GITHUB_REF_NAME#v}" "${{ github.server_url }}/${{ github.repository }}"

      - name: Zip it
        run: cd dist/foundry/map-weaver && zip -r ../map-weaver.zip . -x '*.git*'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Map Weaver ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Install in Foundry (Add-on Modules → Install Module) with the manifest URL:
            ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/module.json
          files: |
            dist/foundry/map-weaver.zip
            dist/foundry/module.json
